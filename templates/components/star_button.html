{% with starred=obj.starred_by.all %}
<form method="post" action="{% url url_name obj.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in starred %} is-starred{% endif %}"
            title="{% if starred %}Dibintangi oleh {{ starred|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
         <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/>
        </svg>
        {% if user in starred %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ starred|length }}</span>
    </button>
</form>
{% endwith %}
